name: engine

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job file to render
        default: jobs/demo.json
        required: true
      fetch:
        description: Fetch licensed media first (true/false)
        default: "false"
        required: false
  push:
    paths:
      - "engine/**"
      - "jobs/**"
      - "tests/**"
      - ".github/workflows/engine.yml"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gate first. The loudness bug that turned five runs red would have been
  # caught here in 2 seconds instead of on a 6-minute render.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pytest pillow numpy requests

      - name: Unit tests
        run: python3 -m pytest tests/ -v

  render:
    needs: test
    runs-on: ubuntu-latest          # public repo: 4 vCPU / 16 GB
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation espeak-ng
          pip install --quiet pillow numpy requests scipy librosa soundfile
          mkdir -p "$HOME/assets/fonts"
          # repo fonts if present, else the sistem ones we just installed
          if [ -d assets/fonts ]; then cp -n assets/fonts/* "$HOME/assets/fonts/" || true; fi
          for f in /usr/share/fonts/truetype/dejavu/*.ttf /usr/share/fonts/truetype/liberation/*.ttf; do
            cp -n "$f" "$HOME/assets/fonts/" 2>/dev/null || true
          done
          ls "$HOME/assets/fonts" | head

      - name: What can this runner do?
        run: python3 engine/scripts/status.py

      - name: Probe media sources
        continue-on-error: true
        run: |
          set +e
          echo "--- openverse ---"
          curl -sS -m 25 -o /tmp/ov.json -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" \
            "https://api.openverse.org/v1/images/?q=pepper&page_size=2&license=cc0" || echo "curl failed: $?"
          head -c 300 /tmp/ov.json 2>/dev/null; echo
          echo "--- wikimedia (fallback) ---"
          curl -sS -m 25 -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" \
            "https://commons.wikimedia.org/w/api.php?action=query&format=json&list=search&srsearch=pepper" || echo "curl failed: $?"
          echo "--- generic internet ---"
          curl -sS -m 15 -o /dev/null -w "http=%{http_code}\n" https://api.github.com || echo "curl failed: $?"

      - name: Fetch licensed assets
        if: ${{ github.event.inputs.fetch == 'true' }}
        run: python3 engine/scripts/fetch_assets.py --job "${{ github.event.inputs.job }}" --what both

      - name: Render
        run: |
          mkdir -p out
          python3 engine/scripts/render.py "${{ github.event.inputs.job || 'jobs/demo.json' }}" --out out

      - name: Quality report
        if: always()
        run: |
          echo '### Render report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat out/*/report.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "no report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### QC' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat out/*/qc.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "no qc" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_number }}
          path: |
            out/**/*.mp4
            out/**/report.txt
            out/**/qc.json
            out/**/timeline.json
            out/**/credits.json
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Ears. The technical gate (qc.py) says the file is valid; this says whether it
  # is any good. Non-blocking on purpose: a taste score is information, not a
  # build failure — but it is written to the run summary either way.
  # ---------------------------------------------------------------------------
  hear:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      EARSHOT_HOME: ${{ github.workspace }}/.earshot-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.earshot-cache
          key: earshot-models-${{ hashFiles('skills/earshot/pyproject.toml') }}

      - name: Install earshot (CPU torch)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -e skills/earshot
          earshot doctor --fetch
          earshot doctor | tail -3

      - name: Download the render
        uses: actions/download-artifact@v4
        with:
          name: render-${{ github.run_number }}
          path: artifact

      - name: Listen to it
        run: |
          set -e
          MP4=$(find artifact -name '*.mp4' | head -1)
          echo "film: $MP4"
          echo "### What it sounds like" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          earshot measure "$MP4" >> $GITHUB_STEP_SUMMARY
          earshot timeline "$MP4" --detail low | head -30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Scorecard" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          earshot critique "$MP4" --fast | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
