name: publish

# Takes a built video and pushes it to YouTube / Instagram / Facebook
# using the skills/ytshort bot. Manual trigger, dry-run by default.
on:
  workflow_dispatch:
    inputs:
      video_artifact:
        description: 'Artifact name from a render run (leave blank to skip)'
        required: false
        default: ''
      job_file:
        description: 'Publish job spec'
        required: true
        default: 'jobs/publish_example.json'
      dry_run:
        description: 'true = validate only, do not post'
        required: true
        default: 'true'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          [ -f skills/ytshort/requirements.txt ] && pip install -r skills/ytshort/requirements.txt || true

      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.video_artifact != '' }}
        with:
          name: ${{ github.event.inputs.video_artifact }}
          path: out

      - name: Check secrets present
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          for v in YT_REFRESH_TOKEN IG_ACCESS_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::warning::$v is not set — that platform will be skipped"
            else
              echo "$v: set"
            fi
          done

      - name: Publish
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          JOB_FILE: ${{ github.event.inputs.job_file }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_IDS: ${{ secrets.IG_USER_IDS }}
          FB_PAGE_IDS: ${{ secrets.FB_PAGE_IDS }}
        run: |
          set -euo pipefail
          echo "dry_run=$DRY_RUN  job=$JOB_FILE"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — nothing will be posted."
            ls -la out/ 2>/dev/null || echo "(no artifact downloaded)"
            exit 0
          fi
          cd skills/ytshort
          python bot.py run --job "../../$JOB_FILE"
