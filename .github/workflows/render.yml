name: render — hyperframes + lemo style

# Two things were sitting in maker/skills unused: hyperframes (Apache-2.0) and
# nothing at all for style. This job proves the pair works:
#   lemo-opuscar  supplies the STYLE (what it should look like)
#   hyperframes   renders it (HTML -> MP4)
#
# Neither is vendored into maker. Both are cloned/installed at run time, and
# the licence of each is printed before anything runs.

on:
  workflow_dispatch:
    inputs:
      style:
        description: "lemo style to use as the brief"
        required: true
        default: "swiss-motion"
      seconds:
        description: "duration of the test render"
        required: true
        default: "6"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # hyperframes requires >= 22

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu

      - name: Who are we invoking (licences, before anything runs)
        run: |
          echo "hyperframes : npm package, licence $(npm view hyperframes license 2>/dev/null)"
          git clone -q --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git /tmp/lemo
          echo "lemo-opuscar: $(head -3 /tmp/lemo/LICENSE | tr '\n' ' ')"
          echo "-------------- styles available in lemo --------------"
          ls /tmp/lemo/styles | head -30
          echo "... $(ls /tmp/lemo/styles | wc -l) total"

      - name: Read the chosen style brief
        id: brief
        run: |
          S="${{ inputs.style }}"
          if [ -f "/tmp/lemo/styles/$S/STYLE.md" ]; then
            cp "/tmp/lemo/styles/$S/STYLE.md" work_style.md 2>/dev/null || \
              { mkdir -p .; cp "/tmp/lemo/styles/$S/STYLE.md" work_style.md; }
            echo "found: styles/$S/STYLE.md"
            head -40 work_style.md
          else
            echo "::warning::style '$S' not found — listing what exists"
            ls /tmp/lemo/styles
            # fall back to whichever styles exist
            FIRST=$(ls /tmp/lemo/styles | head -1)
            cp "/tmp/lemo/styles/$FIRST/STYLE.md" work_style.md
            echo "using fallback: $FIRST"
          fi

      - name: Build the HTML frame
        run: |
          mkdir -p /tmp/render_html
          cat > /tmp/render_html/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <style>
            *{margin:0;padding:0;box-sizing:border-box}
            html,body{width:1080px;height:1920px;background:#0e0e10;overflow:hidden;
                      font-family:Inter,"DejaVu Sans",sans-serif}
            #root{position:relative;width:1080px;height:1920px}
            .grid{position:absolute;inset:0;
                  background-image:linear-gradient(#ffffff10 1px,transparent 1px),
                                   linear-gradient(90deg,#ffffff10 1px,transparent 1px);
                  background-size:120px 120px}
            .bar{position:absolute;left:0;top:0;width:100%;height:24px;background:#e81a1a;
                 transform-origin:left center}
            .kicker{position:absolute;left:80px;top:180px;color:#8a8a92;
                    font-size:30px;letter-spacing:12px;text-transform:uppercase}
            .title{position:absolute;left:80px;top:250px;color:#fff;font-size:110px;
                   font-weight:bold;line-height:0.95;max-width:900px}
            .title em{font-style:normal;color:#e81a1a}
            .rule{position:absolute;left:80px;top:760px;width:160px;height:8px;background:#e81a1a;
                  transform-origin:left center}
            .rank{position:absolute;left:80px;top:860px;color:#fff;font-size:56px;line-height:1.6}
            .rank span{color:#6a6a72}
            .rank .row{opacity:0}
            .credit{position:absolute;left:80px;bottom:110px;color:#5c5c64;font-size:26px}
            .num{position:absolute;right:70px;bottom:90px;color:#ffffff12;font-size:420px;
                 font-weight:bold;line-height:1}
          </style></head>
          <body>
            <div id="root" data-composition-id="rank-test" data-duration="6"
                 data-width="1080" data-height="1920">
              <div class="grid"></div>
              <div class="bar"></div>
              <div class="kicker">ranked</div>
              <div class="title">THREE<br>CLIPS.<br><em>ONE IS NOT HUMAN.</em></div>
              <div class="rule"></div>
              <div class="rank">
                <div class="row"><span>01</span> The jump</div>
                <div class="row"><span>02</span> The kickflip</div>
                <div class="row"><span>03</span> The save</div>
              </div>
              <div class="credit">hyperframes render</div>
              <div class="num">01</div>
            </div>
            <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
            <script>
              // a registered timeline is what hyperframes seeks frame by frame
              const tl = gsap.timeline({paused:true});
              tl.from(".bar",   {scaleX:0, duration:0.5, ease:"power3.out"}, 0)
                .from(".kicker",{opacity:0, y:20, duration:0.4}, 0.2)
                .from(".title", {opacity:0, y:40, duration:0.7, ease:"power2.out"}, 0.35)
                .from(".rule",  {scaleX:0, duration:0.4, ease:"power3.out"}, 1.1)
                .to(".row",     {opacity:1, duration:0.35, stagger:0.45}, 1.3)
                .from(".num",   {opacity:0, x:40, duration:0.8}, 0.6)
                .to(".title em",{color:"#ffffff", duration:0.6}, 4.2)
                .to("#root",    {opacity:0, duration:0.5}, 5.5);
              window.__timelines = window.__timelines || {};
              window.__timelines["rank-test"] = tl;
            </script>
          </body></html>
          HTML
          ls -la /tmp/render_html/

      - name: Scaffold a hyperframes project
        run: |
          npx --yes hyperframes@0.8.228 init render 2>&1 | tail -20
          echo "----- what init made -----"
          find render -maxdepth 2 -type f | head -20
          echo "----- doctor -----"
          npx --yes hyperframes@0.8.228 doctor 2>&1 | tail -20 || true

      - name: Drop our composition in
        run: |
          # init makes its own example; replace whatever the entry page is
          ENTRY=$(find render -maxdepth 2 -name "*.html" | head -1)
          echo "entry was: $ENTRY"
          if [ -n "$ENTRY" ]; then
            cp "$ENTRY" render/index.orig.html
            cp /tmp/render_html/index.html "$ENTRY"
            echo "replaced $ENTRY"
          else
            mkdir -p render
            cp /tmp/render_html/index.html render/index.html
            ENTRY=render/index.html
          fi
          echo "ENTRY=$ENTRY" >> $GITHUB_ENV

      - name: Render with hyperframes
        run: |
          cd render
          npx --yes hyperframes@0.8.228 render -o out.mp4 2>&1 | tail -40 || true
          ls -la
          ls -la *.mp4 2>/dev/null && echo "RENDER OK" || echo "::warning::no mp4 produced"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_number }}
          path: |
            render/
            work_style.md
          if-no-files-found: warn
          retention-days: 14
